<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบฝาก-รับของ (Test Mode)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f0f4f8; } 
    
    /* --- 1. สไตล์ปุ่มเลือกเมนู (Tabs) แบบ Capsule (คงเดิม) --- */
    .tab-btn { 
      @apply px-6 py-3 rounded-full font-bold text-gray-500 bg-white border border-gray-200 shadow-sm cursor-pointer transition-all duration-300 text-lg flex items-center justify-center gap-2 hover:bg-gray-50 flex-1; 
    }
    
    .tab-btn.active-deposit { 
      @apply text-white border-transparent shadow-lg shadow-emerald-200 scale-105;
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
    }

    .tab-btn.active-receive { 
      @apply text-white border-transparent shadow-lg shadow-blue-200 scale-105;
      background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
    }

    /* --- 2. สไตล์ปุ่มยืนยัน (Submit) แบบ 3D (คงเดิม) --- */
    .btn-submit-3d:active {
      transform: translateY(4px);
      border-bottom-width: 0px;
    }

    /* Animation สำหรับฟอร์ม */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }

    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; visibility: hidden; opacity: 0; transition: opacity 0.2s; }
    .loading-overlay.active { visibility: visible; opacity: 1; }
  </style>
</head>
<body class="pb-10 min-h-screen">

  <script>
    // **********************************************
    // ตั้งค่าระบบ
    // **********************************************
    // 🔥 [ต้องแก้ไข] ใส่ URL Web App ที่ได้จากการ Deploy
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxXbd6ceSD2ho2HvH3uLAdvdXTp8knxFZK3dSi2OqDnR-_lUiNrTqq6qIxE5pInMQdZ/exec"; 
    // **********************************************
  </script>

  <!-- Header -->
  <div class="text-center pt-8 pb-4">
    <div class="inline-block p-3 bg-white rounded-full shadow-md mb-2">
      <span class="text-4xl">📦</span>
    </div>
    <h1 class="text-2xl font-bold text-gray-800">บริการรับ-ฝากพัสดุ</h1>
    <p class="text-gray-500 text-sm">เลือกรายการที่ต้องการทำด้านล่าง</p>
  </div>

  <!-- ปุ่มเมนูแบบ Capsule -->
  <div class="max-w-md mx-auto px-6 mb-6">
    <div class="flex justify-center gap-4 bg-gray-100/50 p-2 rounded-full">
      <button id="tab-deposit" onclick="switchTab('deposit')" class="tab-btn active-deposit">
        <span>📥</span> ฝากของ
      </button>
      <button id="tab-receive" onclick="switchTab('receive')" class="tab-btn">
        <span>📤</span> รับของ
      </button>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4">
    
    <!-- ฟอร์มฝากของ -->
    <form id="depositForm" class="space-y-6 block animate-slide-up">
      
      <!-- Card: รูปภาพ (คงเดิม) -->
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
        <div class="flex items-center gap-2 mb-3">
          <div class="w-1 h-6 bg-emerald-500 rounded-full"></div>
          <label class="text-gray-700 font-bold text-lg">รูปภาพสิ่งของ <span class="text-red-500">*</span></label>
        </div>
        
        <div class="relative w-full group">
          <input type="file" id="dep_image" accept="image/*" class="hidden" onchange="previewImage(this, 'dep_preview', 'dep_placeholder')" required>
          <label for="dep_image" class="flex flex-col items-center justify-center w-full h-64 border-2 border-dashed border-emerald-300 rounded-2xl cursor-pointer bg-emerald-50/50 hover:bg-emerald-50 transition-all duration-300 relative overflow-hidden">
            <div id="dep_placeholder" class="flex flex-col items-center transform transition-transform group-hover:scale-110 z-10">
              <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-3 shadow-md text-3xl">📷</div>
              <span class="text-emerald-700 font-bold">ถ่ายรูปสินค้า</span>
              <span class="text-xs text-emerald-500 bg-white px-2 py-1 rounded-full mt-2 shadow-sm">จำเป็นต้องใส่</span>
            </div>
            
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-emerald-200 rounded-full opacity-20 z-0"></div>
            <div class="absolute -top-10 -left-10 w-24 h-24 bg-emerald-300 rounded-full opacity-20 z-0"></div>

            <img id="dep_preview" class="absolute w-full h-full object-contain bg-gray-50 z-20 hidden">
          </label>
        </div>
      </div>

      <!-- Card: ข้อมูล (แบบ Clean) -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-4">
        <div>
          <label for="dep_branch" class="block text-gray-700 font-bold mb-2 text-lg">🏢 สาขาที่รับฝาก <span class="text-red-500">*</span></label>
          <input type="text" id="dep_branch" required placeholder="เช่น สาขาสยาม, สาขาลาดพร้าว..." class="w-full px-4 py-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none transition-colors">
          <p class="text-xs text-gray-400 mt-1 pl-1">โปรดระบุชื่อสาขาให้ชัดเจน</p>
        </div>
        
        <div>
          <label for="dep_details" class="block text-gray-700 font-bold mb-2 text-lg">📝 รายละเอียดเพิ่มเติม <span class="text-red-500">*</span></label>
          <textarea id="dep_details" required rows="3" placeholder="เช่น กล่องสีแดง, เอกสารซองน้ำตาล..." class="w-full px-4 py-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none transition-colors"></textarea>
          <p class="text-xs text-gray-400 mt-1 pl-1">ระบุลักษณะของเพื่อให้ตรวจสอบได้ง่าย</p>
        </div>
      </div>

      <!-- ปุ่ม Submit (แบบ 3D) -->
      <button type="submit" class="btn-submit-3d w-full bg-emerald-500 text-white text-xl font-bold py-4 rounded-2xl shadow-lg border-b-4 border-emerald-700 transition-all flex items-center justify-center gap-3">
        <span>✅</span> ยืนยันการฝาก
      </button>
    </form>

    <!-- ฟอร์มรับของ -->
    <form id="receiveForm" class="space-y-6 hidden animate-slide-up">
      
      <!-- Card: Input ID -->
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 text-center">
        <label for="rec_itemId" class="block text-gray-700 font-bold mb-4 text-xl">🔢 รหัสพัสดุ (ItemID)</label>
        <div class="relative">
          <input type="tel" id="rec_itemId" required placeholder="XXXX" class="w-full px-4 py-6 bg-blue-50 border-2 border-blue-200 focus:border-blue-500 rounded-2xl text-center text-4xl font-bold text-blue-600 outline-none tracking-widest placeholder-blue-200 transition-all">
          <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
            <span class="text-blue-300 text-2xl">#</span>
          </div>
        </div>
        <p class="text-sm text-gray-400 mt-3 bg-gray-50 py-2 rounded-lg inline-block px-4">
          💡 ดูรหัสได้จากข้อความแจ้งเตือนใน LINE
        </p>
      </div>

      <!-- Card: รูปหลักฐาน (ปรับปรุงใหม่: ใส่พื้นหลังวงกลมเหมือนฝากของ แต่เป็นสีฟ้า) -->
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
        <div class="flex items-center gap-2 mb-3">
          <div class="w-1 h-6 bg-blue-500 rounded-full"></div>
          <label class="text-gray-700 font-bold text-lg">หลักฐานการรับ <span class="text-red-500">*</span></label>
        </div>
        
        <div class="relative w-full group">
          <input type="file" id="rec_image" accept="image/*" class="hidden" onchange="previewImage(this, 'rec_preview', 'rec_placeholder')" required>
          <label for="rec_image" class="flex flex-col items-center justify-center w-full h-64 border-2 border-dashed border-blue-300 rounded-2xl cursor-pointer bg-blue-50/50 hover:bg-blue-50 transition-all duration-300 relative overflow-hidden">
            <div id="rec_placeholder" class="flex flex-col items-center transform transition-transform group-hover:scale-110 z-10">
              <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-3 shadow-md text-3xl">🤳</div>
              <span class="text-blue-700 font-bold">ถ่ายรูปยืนยัน</span>
              <span class="text-xs text-blue-500 bg-white px-2 py-1 rounded-full mt-2 shadow-sm">จำเป็นต้องใส่</span>
            </div>
            
            <!-- ตกแต่งพื้นหลัง (สีฟ้า) -->
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-blue-200 rounded-full opacity-20 z-0"></div>
            <div class="absolute -top-10 -left-10 w-24 h-24 bg-blue-300 rounded-full opacity-20 z-0"></div>

            <img id="rec_preview" class="absolute w-full h-full object-contain bg-gray-50 z-20 hidden">
          </label>
        </div>
      </div>

      <!-- ปุ่ม Submit (แบบ 3D) -->
      <button type="submit" class="btn-submit-3d w-full bg-blue-500 text-white text-xl font-bold py-4 rounded-2xl shadow-lg border-b-4 border-blue-700 transition-all flex items-center justify-center gap-3">
        <span>🚀</span> ยืนยันการรับของ
      </button>
    </form>
  </div>

  <!-- Loading Overlay -->
  <div id="loading" class="loading-overlay backdrop-blur-sm">
    <div class="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center">
      <div class="w-16 h-16 border-4 border-gray-100 border-t-emerald-500 rounded-full animate-spin mb-4"></div>
      <p class="font-bold text-gray-700 text-lg">กำลังบันทึก...</p>
      <p class="text-gray-400 text-sm">กรุณารอสักครู่</p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'receive') switchTab('receive');

    function switchTab(mode) {
      const btnDeposit = document.getElementById('tab-deposit');
      const btnReceive = document.getElementById('tab-receive');
      
      btnDeposit.className = 'tab-btn';
      btnReceive.className = 'tab-btn';

      if (mode === 'deposit') {
        document.getElementById('depositForm').classList.remove('hidden');
        document.getElementById('receiveForm').classList.add('hidden');
        btnDeposit.classList.add('active-deposit');
      } else {
        document.getElementById('depositForm').classList.add('hidden');
        document.getElementById('receiveForm').classList.remove('hidden');
        btnReceive.classList.add('active-receive');
      }
    }

    function previewImage(input, previewId, placeholderId) {
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById(previewId).src = e.target.result;
          document.getElementById(previewId).classList.remove('hidden');
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function generateGuestId() {
        let storedId = localStorage.getItem('guest_user_id');
        if (!storedId) {
            storedId = 'GUEST_' + new Date().getTime() + '_' + Math.floor(Math.random() * 1000);
            localStorage.setItem('guest_user_id', storedId);
        }
        return storedId;
    }

    async function submitData(data) {
      document.getElementById('loading').classList.add('active');
      const file = data.fileInput.files[0];
      const reader = new FileReader();
      
      reader.onload = async function(e) {
        const base64Data = e.target.result.split(',')[1];
        try {
          const guestId = generateGuestId();
          const payload = {
            action: data.action,
            userId: guestId, 
            displayName: "Guest User (Test)", 
            pictureUrl: "", 
            imageBase64: base64Data,
            mimeType: file.type,
            branch: data.branch || "",
            details: data.details || "",
            itemId: data.itemId || ""
          };

          const response = await fetch(GAS_API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          
          const result = await response.json();
          document.getElementById('loading').classList.remove('active');
          
          if (result.status === 'success') {
            Swal.fire({ 
                title: 'สำเร็จ!', 
                text: 'บันทึกข้อมูลเรียบร้อย', 
                icon: 'success', 
                confirmButtonColor: '#10B981',
                timer: 2000, 
                showConfirmButton: false 
            }).then(() => {
                window.location.reload(); 
            });
          } else {
            Swal.fire('เกิดข้อผิดพลาด', result.message, 'error');
          }
        } catch (err) {
          document.getElementById('loading').classList.remove('active');
          Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบได้: ' + err.message, 'error');
        }
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('depositForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('dep_image');
      const branch = document.getElementById('dep_branch').value.trim();
      const details = document.getElementById('dep_details').value.trim();
      
      if (!fileInput.files.length) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาถ่ายรูปสิ่งของ', 'warning');
      if (!branch) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาระบุสาขา', 'warning');
      if (!details) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาระบุรายละเอียดสิ่งของ', 'warning');
      
      submitData({ action: 'deposit', branch: branch, details: details, fileInput: fileInput });
    });

    document.getElementById('receiveForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('rec_image');
      const itemId = document.getElementById('rec_itemId').value.trim();
      
      if (!itemId) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาระบุรหัสพัสดุ (ItemID)', 'warning');
      if (!fileInput.files.length) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาถ่ายรูปเพื่อยืนยันการรับ', 'warning');
      
      submitData({ action: 'receive', itemId: itemId, fileInput: fileInput });
    });
  </script>
</body>
</html>
