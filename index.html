<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบฝาก-รับของ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.8); z-index: 9999; display: flex; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: all 0.3s; }
    .loading-overlay.active { visibility: visible; opacity: 1; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="p-4 max-w-lg mx-auto">

  <div id="loading" class="loading-overlay">
    <div class="flex flex-col items-center">
      <div class="spinner mb-2"></div>
      <p class="text-gray-600">กำลังบันทึกข้อมูล...</p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-lg overflow-hidden">
    <div class="flex border-b">
      <button id="tab-deposit" onclick="switchTab('deposit')" class="flex-1 py-4 font-bold text-gray-500 bg-gray-50 border-b-4 border-transparent">ฝากของ</button>
      <button id="tab-receive" onclick="switchTab('receive')" class="flex-1 py-4 font-bold text-gray-500 bg-gray-50 border-b-4 border-transparent">รับของ</button>
    </div>

    <div class="p-6">
      
      <form id="depositForm" class="hidden">
        <h2 class="text-xl font-bold text-green-600 mb-4">📦 ฝากของ</h2>
        
        <div class="mb-4">
          <label class="block text-gray-700 mb-1">ถ่ายรูปของ</label>
          <input type="file" id="dep_image" accept="image/*" capture="environment" class="w-full border p-2 rounded">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-1">สาขา</label>
          <select id="dep_branch" class="w-full border p-2 rounded bg-white">
            <option value="QS">QS</option>
            <option value="ธว">ธว</option>
            <option value="ทH">ทH</option>
            <option value="ฝว">ฝว</option>
            <option value="5ญ">5ญ</option>
          </select>
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-1">รายละเอียด</label>
          <textarea id="dep_details" class="w-full border p-2 rounded" rows="3" placeholder="ระบุรายละเอียด..."></textarea>
        </div>

        <button type="submit" class="w-full bg-green-500 text-white py-3 rounded-lg font-bold shadow hover:bg-green-600">ยืนยันการฝาก</button>
      </form>

      <form id="receiveForm" class="hidden">
        <h2 class="text-xl font-bold text-cyan-600 mb-4">✅ รับของคืน</h2>
        
        <div class="mb-4">
          <label class="block text-gray-700 mb-1">ถ่ายรูปหลักฐานการรับ</label>
          <input type="file" id="rec_image" accept="image/*" capture="environment" class="w-full border p-2 rounded">
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-1">หมายเลขรายการ (ID)</label>
          <input type="number" id="rec_itemId" class="w-full border p-2 rounded" placeholder="กรอกเลข ID ที่ต้องการรับคืน">
        </div>

        <button type="submit" class="w-full bg-cyan-500 text-white py-3 rounded-lg font-bold shadow hover:bg-cyan-600">ยืนยันการรับของ</button>
      </form>

    </div>
  </div>

<script>
  // ===========================================
  // ตั้งค่า Config ที่นี่
  // ===========================================
  const LIFF_ID = "1655457282-5GVPJDAM"; 
  const GAS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxS8nF92By9qCJSXFLbHk-rK3hqSjZ1-0IfLNbGRfOHEMv4h7NvLsbQBGRE0WTAowAq/exec"; 
  // ===========================================

  let currentUserId = "";

  // เริ่มต้น LIFF
  window.onload = async function() {
    switchTab('deposit'); // เปิดหน้าแรก
    await initializeLiff();
  };

  async function initializeLiff() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        currentUserId = profile.userId;
        console.log("UserID:", currentUserId);
      } else {
        liff.login();
      }
    } catch (err) {
      console.error('LIFF Error:', err);
      Swal.fire('Error', 'เชื่อมต่อ LINE ไม่สำเร็จ', 'error');
    }
  }

  function switchTab(tab) {
    document.getElementById('depositForm').classList.add('hidden');
    document.getElementById('receiveForm').classList.add('hidden');
    document.getElementById('tab-deposit').className = "flex-1 py-4 font-bold text-gray-400 bg-white border-b-4 border-transparent cursor-pointer";
    document.getElementById('tab-receive').className = "flex-1 py-4 font-bold text-gray-400 bg-white border-b-4 border-transparent cursor-pointer";

    if(tab === 'deposit') {
      document.getElementById('depositForm').classList.remove('hidden');
      document.getElementById('tab-deposit').className = "flex-1 py-4 font-bold text-green-600 bg-green-50 border-b-4 border-green-500 cursor-pointer";
    } else {
      document.getElementById('receiveForm').classList.remove('hidden');
      document.getElementById('tab-receive').className = "flex-1 py-4 font-bold text-cyan-600 bg-cyan-50 border-b-4 border-cyan-500 cursor-pointer";
    }
  }

  // ฟังก์ชันแปลงไฟล์เป็น Base64 และส่งข้อมูล
  async function handleFormSubmit(action, data) {
    if (!currentUserId) {
      await initializeLiff(); // ลอง init อีกรอบ
      if(!currentUserId) return Swal.fire('ไม่พบผู้ใช้', 'กรุณาล็อกอิน LINE', 'error');
    }

    document.getElementById('loading').classList.add('active');

    const fileInput = data.fileInput;
    if (fileInput.files.length === 0) {
      document.getElementById('loading').classList.remove('active');
      return Swal.fire('แจ้งเตือน', 'กรุณาถ่ายรูป', 'warning');
    }

    const file = fileInput.files[0];
    const reader = new FileReader();
    
    reader.onloadend = async function() {
      // ตัดส่วนหัว data:image/jpeg;base64, ออกเพื่อให้ GAS รับไป decode ได้ง่าย
      const base64String = reader.result.replace("data:", "").replace(/^.+,/, "");

      const payload = {
        action: action,
        userId: currentUserId,
        image: base64String,
        ...data.fields // รวมข้อมูลอื่นๆ (branch, details, itemId)
      };

      try {
        // ส่งข้อมูลไป Google Apps Script ด้วย fetch
        // ใช้ mode: 'no-cors' ไม่ได้เพราะเราต้องการอ่าน response JSON
        // ดังนั้น GAS ต้อง set return เป็น JSON ให้ถูกต้อง และ Web App ต้องเป็น access: Anyone
        
        const response = await fetch(GAS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        document.getElementById('loading').classList.remove('active');

        if (result.status === 'success') {
          Swal.fire('สำเร็จ', result.message, 'success').then(() => {
             if(action === 'deposit') document.getElementById('depositForm').reset();
             if(action === 'receive') document.getElementById('receiveForm').reset();
             liff.closeWindow();
          });
        } else {
          Swal.fire('เกิดข้อผิดพลาด', result.message, 'error');
        }

      } catch (error) {
        document.getElementById('loading').classList.remove('active');
        console.error(error);
        Swal.fire('Error', 'ไม่สามารถส่งข้อมูลได้ (เช็ค URL หรือ Internet)', 'error');
      }
    };
    
    reader.readAsDataURL(file);
  }

  // Event Listener: ฝากของ
  document.getElementById('depositForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const branch = document.getElementById('dep_branch').value;
    const details = document.getElementById('dep_details').value;
    const fileInput = document.getElementById('dep_image');

    if (!branch || !details) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกให้ครบถ้วน', 'warning');

    handleFormSubmit('deposit', {
      fileInput: fileInput,
      fields: { branch: branch, details: details }
    });
  });

  // Event Listener: รับของ
  document.getElementById('receiveForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const itemId = document.getElementById('rec_itemId').value;
    const fileInput = document.getElementById('rec_image');

    if (!itemId) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาระบุ ID', 'warning');

    handleFormSubmit('receive', {
      fileInput: fileInput,
      fields: { itemId: itemId }
    });
  });

</script>
</body>
</html>
